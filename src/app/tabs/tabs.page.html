<ion-tabs>

  <ion-tab-bar *ngIf="!isConsultant" slot="bottom" class="customer-tab-bar">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="chatbot" href="/tabs/chatbot">
      <ion-icon aria-hidden="true" name="chatbubble-outline"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="sparkles-outline"></ion-icon>
    </ion-tab-button>
    
    <ion-tab-button tab="tab4" href="/tabs/tab4">
      <ion-icon aria-hidden="true" name="person-outline"></ion-icon>
    </ion-tab-button>
      
  </ion-tab-bar>

  <ion-tab-bar *ngIf="isConsultant" slot="bottom" class="consultant-tab-bar">
    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="briefcase-outline"></ion-icon>
      <ion-label>Client workspace</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="chatbot" href="/tabs/chatbot">
      <ion-icon aria-hidden="true" name="sparkles-outline"></ion-icon>
      <ion-label>AI assistant</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3?section=meetings">
      <ion-icon aria-hidden="true" name="calendar-outline"></ion-icon>
      <ion-label>Meetings</ion-label>
    </ion-tab-button>

    <ion-tab-button type="button" (click)="consultantLogout()">
      <ion-icon aria-hidden="true" name="log-out-outline"></ion-icon>
      <ion-label>Log out</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
